# Puercos y Verrugas VTT en un servidor propio (Raspberry Pi, mini PC, VPS…), publicado en internet con un
# túnel de Cloudflare. Guía completa: README.md → «Servidor en internet».
#
# Uso:  cp .env.example .env   (y rellénalo)
#       mkdir -p datos
#       docker compose up -d
services:
  mesa:
    image: ghcr.io/jorchcanelo/puercos-y-verrugas-vtt:latest
    restart: unless-stopped # también es lo que vuelve a arrancarla al pulsar «Reiniciar el servidor» en el panel
    init: true
    environment:
      VTT_ADMIN_PASSWORD: ${VTT_ADMIN_PASSWORD:?Falta VTT_ADMIN_PASSWORD en el archivo .env}
      VTT_PUBLIC_URL: ${VTT_PUBLIC_URL:-}
    volumes:
      - ./datos:/data # base de datos, archivos subidos, módulos y copias: haz respaldos de esta carpeta
    ports:
      - "3000:3000" # acceso desde tu red local (http://IP-del-servidor:3000). Quítalo si no lo quieres.

  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Falta CLOUDFLARE_TUNNEL_TOKEN en el archivo .env}
    # Comparte la red de la mesa: en Cloudflare la ruta apunta a http://localhost:3000 y la mesa ve las
    # conexiones del túnel como locales (así confía en las cabeceras con la IP real y el https).
    network_mode: "service:mesa"
    depends_on:
      - mesa
